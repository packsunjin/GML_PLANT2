<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트팜 전시</title>
<!-- 디자인 없음(2026-11-12). 판정·펌프 판단은 서버(src/booth.py FarmPump)가 하고, 여기는 /api/farm 값을 그대로 보인다. -->
<style>
canvas { display: block; width: 100%; max-width: 720px; height: 160px; }
</style>
</head>
<body>
<p id="src"></p>
<h1>식물 전기신호 스마트팜</h1>

<h2>전압</h2>
<canvas id="sig"></canvas>
<p id="env"></p>

<h2>판정</h2>
<p id="state">-</p>
<p id="stateText"></p>
<progress id="hold" max="1" value="0"></progress>

<h2>펌프</h2>
<p id="pump">-</p>
<p id="pumpText"></p>
<p id="notice"></p>
<button id="test">시험 (15초 동안 수분부족으로 가정)</button>

<script>
const $ = id => document.getElementById(id);
let buf = [], lastT = 0, N = 600;

function draw() {
  const c = $("sig"), W = c.clientWidth, H = c.clientHeight;
  if (!W) return;
  if (c.width !== W) { c.width = W; c.height = H; }
  const g = c.getContext("2d"); g.clearRect(0, 0, W, H);
  if (buf.length < 2) return;
  let lo = Math.min(...buf), hi = Math.max(...buf); const m = Math.max(1, (hi - lo) * .1); lo -= m; hi += m;
  g.beginPath();
  buf.forEach((v, i) => { const x = (N - buf.length + i) / (N - 1) * W, y = H - (v - lo) / (hi - lo) * H; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
  g.fillText(hi.toFixed(0) + " mV", 2, 10); g.fillText(lo.toFixed(0) + " mV", 2, H - 2);
}
function render(d) {
  $("src").textContent = d.source_kind === "hardware" ? "센서 연결됨" : "센서 없음(" + (d.source || "시뮬레이션") + ")";
  const now = performance.now(), hz = d.signal_hz || 10; N = Math.round(60 * hz);
  if (d.signal && d.signal.length) {       // 서버가 준 0.1초 평균을 지난 폴링 뒤 흐른 시간만큼만 이어 붙인다
    const n = lastT ? Math.min(d.signal.length, Math.max(1, Math.round((now - lastT) / 1000 * hz))) : d.signal.length;
    buf = buf.concat(d.signal.slice(-n).map(v => v * 1000)).slice(-N);
  }
  lastT = now; draw();
  const e = d.env;
  $("env").textContent = e && e.temp_c != null ? e.temp_c + " °C, 습도 " + e.humidity_pct + " %" : "";
  $("state").textContent = d.testing ? d.target + " (시험)" : (d.state || "판정 없음");
  $("stateText").textContent = d.testing ? "시험 " + Math.ceil(d.test_left) + "초 남음"
    : d.state && d.state !== "판정 없음" ? "모델 " + d.model + (d.proba != null ? ", " + Math.round(d.proba * 100) + "%" : "") : (d.worker_error || "");
  $("hold").value = Math.min(1, d.held_sec / d.hold_sec);
  $("pump").textContent = d.pump_on ? "켜짐 (" + Math.ceil(d.pump_left) + "초 남음)" : "꺼짐";
  $("pumpText").textContent = "수분부족 " + d.hold_sec + "초 → 펌프 " + d.run_sec + "초 → 쉼 " + d.rest_sec + "초. 지금까지 " + d.runs + "번"
    + (d.rest_left > 0 ? ", 쉬는 중 " + Math.ceil(d.rest_left) + "초" : "");
  $("notice").textContent = d.connected ? "" : "펌프 연결 안 됨 (화면 표시만)";
}
$("test").onclick = async () => { try { render(await (await fetch("/api/farm/test", {method: "POST"})).json()); } catch (e) {} };
async function tick() {
  try { render(await (await fetch("/api/farm")).json()); } catch (e) { $("src").textContent = "서버 연결 끊김"; }
  setTimeout(tick, 500);
}
tick();
</script>
</body>
</html>
