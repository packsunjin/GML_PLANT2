<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>머신러닝 체험</title>
<!-- 디자인 없음(2026-11-12). 화면 구조와 동작만 있다. 화면은 section[data-screen] 하나씩만 보인다.
     계산·진행 단계는 전부 서버(src/booth.py)가 쥐고, 여기는 /api/booth 의 phase 를 보고 그리기만 한다. -->
<style>
section[data-screen] { display: none; }
section[data-screen].on { display: block; }
canvas { display: block; width: 100%; max-width: 720px; }
#sig { height: 160px; } #spec { height: 200px; }
</style>
</head>
<body>

<p id="src"></p>

<section data-screen="main">
  <h1>식물 신호 머신러닝</h1>
  <button id="goNew">머신러닝 학습해보기</button>
  <p id="err"></p>

  <h2>판정</h2>
  <p>모델: <span id="selName">선택 안 함</span></p>
  <p id="verdict">-</p>
  <p id="probs"></p>

  <h2>전압</h2>
  <canvas id="sig"></canvas>
  <h2>스펙트로그램 (최근 2초, 0–62.5 Hz)</h2>
  <canvas id="spec"></canvas>

  <h2>모델</h2>
  <table id="models">
    <thead><tr><th>학교</th><th>만든 시각</th><th>방식</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
</section>

<section data-screen="school">
  <h1>학교 이름</h1>
  <form id="schoolForm">
    <input id="school" maxlength="30" autocomplete="off" required>
    <button type="submit">다음</button>
    <button type="button" class="cancel">취소</button>
  </form>
  <p id="schoolErr"></p>
</section>

<section data-screen="normal_ready">
  <h1>정상 학습하기</h1>
  <p><span class="school"></span></p>
  <p>식물을 건드리지 않은 상태로 <span class="recSec"></span>초 기록합니다.</p>
  <button class="rec">기록 시작</button>
  <button class="cancel">취소</button>
</section>

<section data-screen="normal_rec">
  <h1>정상 기록 중</h1>
  <p class="left"></p>
  <progress class="bar" max="1" value="0"></progress>
</section>

<section data-screen="stim_ready">
  <h1>자극 학습하기</h1>
  <p><span class="school"></span></p>
  <p>식물에 손을 올린 상태로 <span class="recSec"></span>초 기록합니다.</p>
  <button class="rec">기록 시작</button>
  <button class="cancel">취소</button>
</section>

<section data-screen="stim_rec">
  <h1>자극 기록 중</h1>
  <p class="left"></p>
  <progress class="bar" max="1" value="0"></progress>
</section>

<section data-screen="training">
  <h1>모델 학습 중입니다</h1>
</section>

<section data-screen="done">
  <h1>모델이 생성되었습니다</h1>
  <p><span class="school"></span></p>
  <button id="pickNew">모델 선택하기</button>
</section>

<script>
const $ = id => document.getElementById(id);
const all = (sel, fn) => document.querySelectorAll(sel).forEach(fn);
let entering = false, last = null, busy = false;

async function call(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  return r.json();
}
async function act(action, body) {
  if (busy) return null;
  busy = true;
  let d = null;
  try { d = await call("/api/booth/" + action, body || {}); render(d); } catch (e) {}
  busy = false;
  return d;
}

$("goNew").onclick = () => { entering = true; $("school").value = ""; $("schoolErr").textContent = ""; show(); $("school").focus(); };
$("schoolForm").onsubmit = async ev => {
  ev.preventDefault();
  const d = await act("start", {school: $("school").value});
  if (d && d.ok) entering = false; else if (d) $("schoolErr").textContent = d.error || "";
};
all(".rec", b => b.onclick = () => act("record"));
$("pickNew").onclick = () => { if (last && last.new_model) act("select", {id: last.new_model.id}); };
all(".cancel", b => b.onclick = () => { entering = false; if (last && last.phase !== "main") act("cancel"); else show(); });

function show() {
  const name = last && last.phase !== "main" ? last.phase : (entering ? "school" : "main");
  all("section[data-screen]", s => s.classList.toggle("on", s.dataset.screen === name));
}

function drawSignal(d) {
  const c = $("sig"), W = c.clientWidth, H = c.clientHeight;
  if (!W) return;
  if (c.width !== W) { c.width = W; c.height = H; }
  const g = c.getContext("2d"), y = d.signal_mv;
  g.clearRect(0, 0, W, H);
  if (y.length < 2) return;
  let lo = Math.min(...y), hi = Math.max(...y); const m = Math.max(1, (hi - lo) * .1); lo -= m; hi += m;
  const n = Math.round(d.plot_sec * d.signal_hz);
  g.beginPath();
  y.forEach((v, i) => { const x = (n - y.length + i) / (n - 1) * W, yy = H - (v - lo) / (hi - lo) * H; i ? g.lineTo(x, yy) : g.moveTo(x, yy); });
  g.stroke();
  g.fillText(hi.toFixed(0) + " mV", 2, 10); g.fillText(lo.toFixed(0) + " mV", 2, H - 2);
}
function drawSpec(d) {
  const c = $("spec"), W = c.clientWidth, H = c.clientHeight;
  if (!W) return;
  if (c.width !== W) { c.width = W; c.height = H; }
  const g = c.getContext("2d"); g.clearRect(0, 0, W, H);
  if (!d.spec) return;
  const z = d.spec.db, nf = z.length, nt = z[0].length;
  let lo = Infinity, hi = -Infinity;
  z.forEach(r => r.forEach(v => { if (v < lo) lo = v; if (v > hi) hi = v; }));
  const cw = W / nt, ch = H / nf;
  for (let f = 0; f < nf; f++) for (let t = 0; t < nt; t++) {
    const k = hi > lo ? (z[f][t] - lo) / (hi - lo) : 0;          // 0 = 가장 약함, 1 = 가장 셈
    g.fillStyle = "hsl(" + (240 - 240 * k) + ",90%," + (20 + 40 * k) + "%)";
    g.fillRect(t * cw, H - (f + 1) * ch, Math.ceil(cw), Math.ceil(ch));   // 아래가 0 Hz
  }
}

function render(d) {
  last = d;
  $("src").textContent = d.paused ? "수집 작업 중" : d.source_kind === "hardware" ? "센서 연결됨" : "센서 없음(" + (d.source || "시뮬레이션") + ")";
  show();
  all(".school", e => e.textContent = d.school || "");
  all(".recSec", e => e.textContent = d.rec_sec);
  if (d.recording) {
    all("section.on .left", e => e.textContent = Math.ceil(d.recording.left) + "초 남음");
    all("section.on .bar", e => e.value = 1 - d.recording.left / d.recording.total);
  }
  if (d.phase !== "main" || entering) return;
  $("err").textContent = d.error || "";
  const sel = d.models.find(m => m.id === d.selected);
  $("selName").textContent = sel ? sel.school : "선택 안 함";
  $("verdict").textContent = d.pred ? d.pred.label : "-";
  $("probs").textContent = d.pred ? d.labels.map(l => l + " " + Math.round((d.pred.probs[l] || 0) * 100) + "%").join(" · ") : "";
  drawSignal(d); drawSpec(d);
  const tb = $("models").tBodies[0], key = d.models.map(m => m.id).join() + "|" + d.selected;
  if (tb.dataset.key !== key) {
    tb.dataset.key = key; tb.innerHTML = "";
    d.models.forEach(m => {
      const tr = tb.insertRow();
      tr.insertCell().textContent = m.school;
      tr.insertCell().textContent = new Date(m.created * 1000).toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit"});
      tr.insertCell().textContent = m.algo;
      const b = document.createElement("button");
      b.textContent = m.id === d.selected ? "선택됨" : "선택"; b.disabled = m.id === d.selected;
      b.onclick = () => act("select", {id: m.id});
      tr.insertCell().append(b);
    });
  }
}

async function tick() {
  if (!busy) { try { render(await call("/api/booth")); } catch (e) { $("src").textContent = "서버 연결 끊김"; } }
  setTimeout(tick, 300);
}
tick();
</script>
</body>
</html>
