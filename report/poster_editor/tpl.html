<title>GML 포스터 편집기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 레이아웃: 위 도구 막대 + 포스터 두 칸(양식과 같은 배치)을 화면 폭에 맞춰 축소 */
:root{--bg:#ece7df;--panel:#fbf9f6;--fg:#231f1a;--muted:#6d655b;--accent:#905720;--ok:#2f7d4a;--warn:#b3261e;--line:#d9cfc1;
--sans:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--panel:#2a2621;--fg:#efe9e1;--muted:#b0a596;--accent:#d49a5e;--ok:#6fc08b;--warn:#f08a80;--line:#4a4239;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a17;--panel:#2a2621;--fg:#efe9e1;--muted:#b0a596;--accent:#d49a5e;--ok:#6fc08b;--warn:#f08a80;--line:#4a4239;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 16px;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.bar h1{font-size:17px;margin:0;font-weight:700}
.hint{font-size:13px;color:var(--muted);flex:1 1 260px;min-width:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border-radius:8px;padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted);min-width:0}
.status.ok{color:var(--ok)}.status.err{color:var(--warn)}
.gauges{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.gauge{display:flex;align-items:center;gap:6px}
.gauge .track{width:110px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gauge .fill{height:100%;background:var(--ok)}
.gauge.over .fill{background:var(--warn)}.gauge.over b{color:var(--warn)}
.confirm{display:none;gap:8px;align-items:center;font-size:13px}
.confirm.on{display:flex}
.stage{overflow-x:auto}
.poster{display:flex;gap:40px;align-items:flex-start;width:max-content;padding:24px;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.col{width:1048px;display:flex;flex-direction:column;gap:6px}
.sbar{background:#905720;color:#fff;font:700 30px/1.3 var(--sans);padding:6px 18px;border-radius:6px}
.sec{outline:none;border-radius:4px}
.sec[contenteditable="true"]:hover{box-shadow:0 0 0 3px #f1dfc6}
.sec[contenteditable="true"]:focus{box-shadow:0 0 0 3px #905720}
.limit{border-top:4px dashed #b3261e;color:#b3261e;font:700 22px var(--sans);padding-top:4px}
@media (prefers-reduced-motion:no-preference){.gauge .fill{transition:width .2s}}
/*POSTERCSS*/
</style>
<div class="bar">
  <h1>GML 포스터 편집기</h1>
  <div class="hint">글자를 눌러 바로 고치세요. 다 고치면 저장을 누르고 Claude에게 "포스터 수정했어"라고 말하면 한글 파일로 다시 만듭니다.</div>
  <div class="gauges">
    <div class="gauge" id="gL"><span>왼쪽 칸</span><span class="track"><span class="fill"></span></span><b></b></div>
    <div class="gauge" id="gR"><span>오른쪽 칸</span><span class="track"><span class="fill"></span></span><b></b></div>
  </div>
  <div class="btns">
    <button id="save" class="primary">저장</button>
    <button id="reset">처음 내용으로</button>
    <span class="confirm" id="confirm">저장 안 한 수정이 사라집니다. <button id="resetYes">되돌리기</button><button id="resetNo">취소</button></span>
  </div>
  <div class="status" id="status">불러오는 중…</div>
</div>
<div class="stage"><div class="poster" id="poster">
  <div class="col" id="colL">
    <div class="sbar">Ⅰ. 서론</div><div class="sec" data-k="s1"></div>
    <div class="sbar">Ⅱ. 이론적 배경 및 선행 연구</div><div class="sec" data-k="s2"></div>
    <div class="sbar">Ⅲ. 연구방법</div><div class="sec" data-k="s3"></div>
    <div class="sbar">Ⅳ. 연구결과</div><div class="sec" data-k="s4a"></div>
  </div>
  <div class="col" id="colR">
    <div class="sec" data-k="s4b"></div>
    <div class="sbar">Ⅴ. 결론 및 제언</div><div class="sec" data-k="s5"></div>
  </div>
</div></div>
<script type="application/json" id="data">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEYS = ['s1','s2','s3','s4a','s4b','s5'];
// 칸 한도(1040px 폭 기준 절 높이 합, 지금 포스터에서 재어 정한 대략값)
const LIMIT = {L: 3050, R: 3165};
const secs = {}; document.querySelectorAll('.sec').forEach(e => secs[e.dataset.k] = e);
const status = document.getElementById('status');
let db = null, dirty = false;
function setStatus(t, cls){ status.textContent = t; status.className = 'status' + (cls ? ' ' + cls : ''); }
function fill(src){ KEYS.forEach(k => { secs[k].innerHTML = src[k] || D.S[k]; }); measure(); }
function measure(){
  const h = k => secs[k].offsetHeight;
  const L = h('s1') + h('s2') + h('s3') + h('s4a'), R = h('s4b') + h('s5');
  for (const [id, v, lim] of [['gL', L, LIMIT.L], ['gR', R, LIMIT.R]]) {
    const g = document.getElementById(id), pct = Math.round(v / lim * 100);
    g.querySelector('.fill').style.width = Math.min(100, pct) + '%';
    g.querySelector('b').textContent = pct + '%' + (pct > 100 ? ' 넘침' : '');
    g.classList.toggle('over', pct > 100);
  }
}
function collect(){
  const out = {};
  KEYS.forEach(k => { let h = secs[k].innerHTML; for (const [a, o] of Object.entries(D.back)) h = h.split('fig/' + a + '.jpg').join('fig/' + o + '.jpg'); out[k] = h; });
  return out;
}
fill({});
KEYS.forEach(k => { secs[k].contentEditable = 'true'; secs[k].spellcheck = false; secs[k].addEventListener('input', () => { dirty = true; setStatus('저장 안 한 수정 있음'); measure(); }); });
document.querySelectorAll('.sec img').forEach(i => i.addEventListener('load', measure));
window.addEventListener('load', measure);
(async () => {
  const t = setTimeout(() => setStatus('저장소에 연결하지 못했습니다. 고칠 수는 있지만 저장은 안 됩니다.', 'err'), 10000);
  try {
    db = await claude.use('db');
    if (!db) { clearTimeout(t); setStatus('저장 기능을 쓸 수 없는 화면입니다(로그인 필요).', 'err'); document.getElementById('save').disabled = true; return; }
    const snap = await db.doc('poster/current').get();
    clearTimeout(t);
    const v = snap && snap.exists ? snap.data() : null;
    if (v) {
      const src = {}; KEYS.forEach(k => { let h = v[k] || ''; for (const [a, o] of Object.entries(D.back)) h = h.split('fig/' + o + '.jpg').join('fig/' + a + '.jpg'); src[k] = h; });
      fill(src); setStatus('저장된 내용을 불러왔습니다' + (v.savedAt ? ' (' + new Date(v.savedAt).toLocaleString('ko-KR') + ')' : ''), 'ok');
    } else setStatus('처음 내용입니다.');
  } catch (e) { clearTimeout(t); setStatus('불러오기 실패: ' + (e && (e.message || e.code) || e), 'err'); }
})();
document.getElementById('save').addEventListener('click', async () => {
  if (!db) { setStatus('저장 기능을 쓸 수 없습니다.', 'err'); return; }
  const b = document.getElementById('save'); b.disabled = true; setStatus('저장 중…');
  try { await db.doc('poster/current').set({ ...collect(), savedAt: Date.now() }); dirty = false; setStatus('저장했습니다. Claude에게 "포스터 수정했어"라고 말하세요.', 'ok'); }
  catch (e) { setStatus('저장 실패: ' + (e && (e.message || e.code) || e) + '. 다시 눌러 보세요.', 'err'); }
  finally { b.disabled = false; }
});
const confirmBox = document.getElementById('confirm');
document.getElementById('reset').addEventListener('click', () => confirmBox.classList.add('on'));
document.getElementById('resetNo').addEventListener('click', () => confirmBox.classList.remove('on'));
document.getElementById('resetYes').addEventListener('click', () => { confirmBox.classList.remove('on'); fill({}); dirty = true; setStatus('처음 내용으로 되돌렸습니다. 저장해야 반영됩니다.'); });
function zoomFit(){ const w = document.querySelector('.stage').clientWidth; const z = Math.min(1, Math.max(0.25, w / 2190)); document.getElementById('poster').style.zoom = z; }
window.addEventListener('resize', zoomFit); zoomFit();
</script>
